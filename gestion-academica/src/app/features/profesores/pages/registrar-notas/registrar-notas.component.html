<div class="contenedor">

  <div class="cabecera">
    <div>
      <h1>📝 Registrar notas</h1>
      <p>Registro de calificaciones de estudiantes</p>
    </div>

    <button class="btn-volver" (click)="volver()">
      ← Volver
    </button>
  </div>

  <div class="card">

    <div class="filtros">

      <div>
        <label>Curso</label>
        <select>
          <option>Matemática</option>
          <option>Comunicación</option>
          <option>Ciencia y Tecnología</option>
        </select>
      </div>

      <div>
        <label>Grado</label>
        <select>
          <option>5to</option>
          <option>4to</option>
          <option>3ro</option>
        </select>
      </div>

      <div>
        <label>Sección</label>
        <select>
          <option>A</option>
          <option>B</option>
          <option>C</option>
        </select>
      </div>

    </div>

    @if (mensaje) {
      <div class="mensaje">
        {{ mensaje }}
      </div>
    }

    <table>
      <thead>
        <tr>
          <th>DNI</th>
          <th>Estudiante</th>
          <th>Nota</th>
        </tr>
      </thead>

      <tbody>
        @for (estudiante of estudiantes; track estudiante.id) {
          <tr>
            <td>{{ estudiante.dni }}</td>
            <td>{{ estudiante.nombre }}</td>

            <td>
              <input
                type="number"
                min="0"
                max="20"
                [value]="estudiante.nota ?? ''"
              >
            </td>
          </tr>
        }
      </tbody>
    </table>

    <div class="acciones">
      <button
        class="btn-guardar"
        (click)="guardarNotas()"
      >
        💾 Guardar notas
      </button>
    </div>

  </div>
</div>
