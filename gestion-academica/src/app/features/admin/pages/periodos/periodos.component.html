<div class="contenedor">

  <div class="cabecera">
    <div>
      <h1>📅 Periodos académicos</h1>
      <p>Gestión de periodos académicos</p>
    </div>

    <button class="btn-volver" (click)="volver()">
      ← Volver
    </button>
  </div>

  <div class="card">

    <div class="acciones">
      <button class="btn-nuevo">
        + Nuevo periodo
      </button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Año</th>
          <th>Periodo</th>
          <th>Inicio</th>
          <th>Fin</th>
          <th>Estado</th>
        </tr>
      </thead>

      <tbody>
        @for (periodo of periodos; track periodo.id) {
          <tr>
            <td>{{ periodo.id }}</td>
            <td>{{ periodo.anio }}</td>
            <td>{{ periodo.nombre }}</td>
            <td>{{ periodo.inicio }}</td>
            <td>{{ periodo.fin }}</td>
            <td>
              <span
                [class.activo]="periodo.estado === 'Activo'"
                [class.finalizado]="periodo.estado === 'Finalizado'"
              >
                {{ periodo.estado }}
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>

  </div>
</div>
