services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestion_academica_db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "crud123!"
      MSSQL_PID: "Developer"
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'crud123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestion_academica_init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./src/main/resources/sql:/sql
    environment:
      SA_PASSWORD: "crud123!"
    command: >
      bash -c "
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'crud123!' -C -Q 'CREATE DATABASE Gestion_Academica' 2>/dev/null || true &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'crud123!' -C -i /sql/db.sql &&
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'crud123!' -C -i /sql/data.sql &&
        echo 'Base de datos inicializada correctamente'
      "
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestion_academica_backend
    depends_on:
      sqlserver:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=Gestion_Academica;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: sa
      DB_PASSWORD: "crud123!"
    ports:
      - "8081:8080"
    restart: on-failure

volumes:
  sqlserver_data:
