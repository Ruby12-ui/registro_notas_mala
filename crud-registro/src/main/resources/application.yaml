server:
  port: 8080

spring:
  application:
    name: crud-registro

  datasource:
    url: jdbc:sqlserver://localhost:1434;databaseName=Gestion_Academica;encrypt=true;trustServerCertificate=true
    username: sa
    password: ${DB_PASSWORD:crud123!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
