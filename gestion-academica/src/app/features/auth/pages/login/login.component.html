<div class="login-container">

  <div class="login-card">

    <div class="logo">
      📚
    </div>

    <h1>
      Gestión Académica
    </h1>

    <p class="subtitulo">
      Sistema de Notas y Asistencias
    </p>

    <form
      (ngSubmit)="iniciarSesion()"
    >

      <div class="campo">

        <label>
          Usuario
        </label>

        <input
          type="text"
          name="usuario"
          [(ngModel)]="usuario"
          placeholder="Ingrese su usuario"
        >

      </div>

      <div class="campo">

        <label>
          Contraseña
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingrese su contraseña"
        >

      </div>

      @if (mensaje) {

        <div class="mensaje">
          {{ mensaje }}
        </div>

      }

      <button type="submit">
        Iniciar sesión
      </button>

    </form>

    <div class="usuarios-demo">

      <p>
        Usuarios de prueba
      </p>

      <span>
        Admin: admin / admin123
      </span>

      <span>
        Profesor: profesor / profesor123
      </span>

      <span>
        Estudiante: estudiante / estudiante123
      </span>

    </div>

  </div>

</div>
