<div class="contenedor">

  <div class="cabecera">
    <div>
      <h1>📋 Mis asistencias</h1>
      <p>Consulta de asistencia</p>
    </div>

    <button class="btn-volver" (click)="volver()">
      ← Volver
    </button>
  </div>

  <div class="card">

    <table>
      <thead>
        <tr>
          <th>Curso</th>
          <th>Fecha</th>
          <th>Estado</th>
        </tr>
      </thead>

      <tbody>
        @for (asistencia of asistencias; track asistencia.id) {
          <tr>
            <td>{{ asistencia.curso }}</td>
            <td>{{ asistencia.fecha }}</td>
            <td>
              <span
                class="estado"
                [class.presente]="asistencia.estado === 'Presente'"
                [class.falta]="asistencia.estado === 'Falta'"
                [class.tardanza]="asistencia.estado === 'Tardanza'"
              >
                {{ asistencia.estado }}
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>

  </div>
</div>
