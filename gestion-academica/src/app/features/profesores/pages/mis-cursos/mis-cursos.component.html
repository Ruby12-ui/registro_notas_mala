<div class="contenedor">

  <div class="cabecera">
    <div>
      <h1>📚 Mis cursos</h1>
      <p>Cursos asignados al profesor</p>
    </div>

    <button class="btn-volver" (click)="volver()">
      ← Volver
    </button>
  </div>

  <div class="card">

    <table>
      <thead>
        <tr>
          <th>Curso</th>
          <th>Grado</th>
          <th>Sección</th>
          <th>Horas semanales</th>
        </tr>
      </thead>

      <tbody>
        @for (curso of cursos; track curso.id) {
          <tr>
            <td>{{ curso.curso }}</td>
            <td>{{ curso.grado }}</td>
            <td>{{ curso.seccion }}</td>
            <td>{{ curso.horas }}</td>
          </tr>
        }
      </tbody>
    </table>

  </div>
</div>
